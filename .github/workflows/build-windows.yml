name: Build Windows SQLCipher

on:
  workflow_dispatch:
    inputs:
      sqlcipher_ref:
        description: SQLCipher tag, branch, commit, or latest (latest stable release)
        required: true
        default: latest
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-windows.yml
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: sqlcipher-windows-build
  cancel-in-progress: false

env:
  REQUESTED_SQLCIPHER_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.sqlcipher_ref || 'latest' }}

jobs:
  build:
    name: Build Windows x64 UCRT
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v5

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            make
            perl
            tcl
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Resolve SQLCipher ref
        run: |
          set -euo pipefail

          requested_ref="${REQUESTED_SQLCIPHER_REF:-latest}"
          if [ "$requested_ref" = "latest" ]; then
            # Keep only stable vX.Y.Z tags. Pre-release tags such as
            # v5.0.0-beta.1 sort after stable tags with sort -V.
            resolved_ref="$(
              git ls-remote --tags --refs https://github.com/sqlcipher/sqlcipher.git 'v*' |
              awk -F/ '{print $NF}' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1
            )"
          else
            resolved_ref="$requested_ref"
          fi

          if [ -z "$resolved_ref" ]; then
            echo "Could not resolve a stable SQLCipher ref." >&2
            exit 1
          fi

          safe_ref="$(printf '%s' "$resolved_ref" | tr '/:@ ' '----')"
          {
            echo "SQLCIPHER_REF=$resolved_ref"
            echo "SQLCIPHER_REF_SAFE=$safe_ref"
            echo "RELEASE_TAG=sqlcipher-$safe_ref-windows-x64-ucrt"
          } >> "$GITHUB_ENV"

          echo "Resolved SQLCipher ref: $resolved_ref"
          echo "Release tag: sqlcipher-$safe_ref-windows-x64-ucrt"

      - name: Skip unchanged release
        id: check_release
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $RELEASE_TAG not found, building it."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone SQLCipher
        if: steps.check_release.outputs.skip != 'true'
        run: |
          set -euo pipefail

          if ! git clone --depth 1 --branch "$SQLCIPHER_REF" https://github.com/sqlcipher/sqlcipher.git source; then
            git clone https://github.com/sqlcipher/sqlcipher.git source
            git -C source checkout "$SQLCIPHER_REF"
          fi

      - name: Apply MinGW GCC workaround
        if: steps.check_release.outputs.skip != 'true'
        run: |
          set -euo pipefail

          if grep -Fq 'uint64_t z = (*x += 0x9e3779b97f4a7c15ULL);' source/src/sqlcipher.c; then
            perl -0pi -e 's/  uint64_t z = \(\*x \+= 0x9e3779b97f4a7c15ULL\);/#if defined(__MINGW32__) \&\& defined(__GNUC__)\n  volatile uint64_t increment = 0x9e3779b97f4a7c15ULL;\n  uint64_t z = (*x += increment);\n#else\n  uint64_t z = (*x += 0x9e3779b97f4a7c15ULL);\n#endif/' source/src/sqlcipher.c
            grep -Fq 'volatile uint64_t increment = 0x9e3779b97f4a7c15ULL;' source/src/sqlcipher.c
            echo "SQLCIPHER_PATCHES=mingw-splitmix64-immediate-workaround" >> "$GITHUB_ENV"
          else
            echo "SQLCIPHER_PATCHES=none" >> "$GITHUB_ENV"
          fi

      - name: Configure and build
        if: steps.check_release.outputs.skip != 'true'
        working-directory: source
        run: |
          set -euo pipefail

          # SQLCipher 5.x enforces SQLITE_USE_URI and
          # SQLITE_DIRECT_OVERFLOW_READ=0 with #error checks in
          # src/sqlcipher.c, and no longer uses SQLITE_HAS_CODEC.
          # Detect the profile from the source so arbitrary refs work too.
          if grep -Fq 'SQLCipher must be compiled with -DSQLITE_USE_URI' src/sqlcipher.c; then
            cflags="-O2 -DSQLITE_USE_URI=1 -DSQLITE_DIRECT_OVERFLOW_READ=0 -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
            echo "Build profile: SQLCipher 5.x"
          else
            cflags="-O2 -DSQLITE_HAS_CODEC -DSQLITE_EXTRA_INIT=sqlcipher_extra_init -DSQLITE_EXTRA_SHUTDOWN=sqlcipher_extra_shutdown"
            echo "Build profile: SQLCipher 4.x"
          fi
          echo "CFLAGS: $cflags"

          ./configure \
            --with-tempstore=yes \
            CFLAGS="$cflags" \
            LDFLAGS="-lcrypto"

          make -j"$(nproc)"

      - name: Package CLI and runtime DLLs
        if: steps.check_release.outputs.skip != 'true'
        run: |
          set -euo pipefail

          mkdir -p dist

          built_cli=""
          for candidate in source/sqlcipher.exe source/sqlite3.exe; do
            if [ -f "$candidate" ]; then
              built_cli="$candidate"
              break
            fi
          done

          if [ -z "$built_cli" ]; then
            built_cli="$(
              find source -maxdepth 3 -type f \( -iname 'sqlcipher.exe' -o -iname 'sqlite3.exe' \) -print -quit
            )"
          fi

          if [ -z "$built_cli" ]; then
            echo "Could not find the built SQLCipher CLI executable." >&2
            find source -maxdepth 3 -type f \( -iname '*sqlcipher*' -o -iname 'sqlite3.exe' \) -print >&2
            exit 1
          fi

          cp "$built_cli" dist/sqlcipher.exe

          ldd dist/sqlcipher.exe |
            awk '/\/ucrt64\// {print $3}' |
            sort -u |
            while read -r dll_path; do
              if [ -f "$dll_path" ]; then
                cp -n "$dll_path" dist/
              fi
            done

          for license_file in LICENSE.md LICENSE.txt SQLITE_LICENSE.md; do
            if [ -f "source/$license_file" ]; then
              cp "source/$license_file" "dist/SQLCIPHER_$license_file"
            fi
          done

          sqlcipher_version="$(./dist/sqlcipher.exe -version | tr -d '\r')"
          cipher_version="$(./dist/sqlcipher.exe ':memory:' 'PRAGMA cipher_version;' | tr -d '\r')"

          if [ -z "$cipher_version" ]; then
            echo "PRAGMA cipher_version returned no output; SQLCipher support may be disabled." >&2
            exit 1
          fi

          cat > dist/BUILD_INFO.txt <<EOF
          SQLCipher ref: $SQLCIPHER_REF
          Build patches: $SQLCIPHER_PATCHES
          Source executable: $built_cli
          Packaged executable: sqlcipher.exe
          SQLCipher CLI version: $sqlcipher_version
          SQLCipher pragma cipher_version: $cipher_version
          Target: Windows x64 UCRT
          Built from: https://github.com/sqlcipher/sqlcipher
          EOF

          artifact_name="sqlcipher-${SQLCIPHER_REF_SAFE}-windows-x64-ucrt.zip"
          (cd dist && zip -9 -r "../$artifact_name" .)

          {
            echo "ARTIFACT_NAME=$artifact_name"
            echo "SQLCIPHER_CLI_VERSION=$sqlcipher_version"
            echo "SQLCIPHER_PRAGMA_VERSION=$cipher_version"
          } >> "$GITHUB_ENV"

      - name: Write release notes
        if: steps.check_release.outputs.skip != 'true'
        run: |
          set -euo pipefail

          cat > release-notes.md <<EOF
          Windows x64 UCRT SQLCipher CLI build.

          - SQLCipher ref: \`$SQLCIPHER_REF\`
          - Build patches: \`$SQLCIPHER_PATCHES\`
          - CLI version: \`$SQLCIPHER_CLI_VERSION\`
          - PRAGMA cipher_version: \`$SQLCIPHER_PRAGMA_VERSION\`
          - Upstream: https://github.com/sqlcipher/sqlcipher

          Archive contents include \`sqlcipher.exe\`, runtime DLLs, build metadata, and upstream license files.
          EOF

      - name: Upload artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: steps.check_release.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sqlcipher-${{ env.SQLCIPHER_REF_SAFE }}-windows-x64-ucrt
          name: SQLCipher ${{ env.SQLCIPHER_REF }} Windows x64 UCRT
          body_path: release-notes.md
          files: ${{ env.ARTIFACT_NAME }}
          make_latest: true
          overwrite_files: true
